spring.application.name=Alumni-management

# --- MySQL Configuration (Default) ---
spring.datasource.url=jdbc:mysql://localhost:3306/alumni_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- H2 In-Memory Database (Uncomment these and comment MySQL above if MySQL is NOT running) ---
# spring.datasource.url=jdbc:h2:mem:alumni_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
spring.jpa.open-in-view=false

jwt.secret=alumni_portal_secret_key_256bit_minimum_length_required_here
jwt.expiration=28800000
